docker:
  name: Docker Build and Test

  needs: test

  runs-on: ubuntu-latest

  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        docker build \
          -f docker/Dockerfile \
          -t aws-devsecops-app:${{ github.sha }} \
          .

    - name: Run Docker Container
      run: |
        docker run \
          -d \
          --name devsecops-app \
          -p 5000:5000 \
          aws-devsecops-app:${{ github.sha }}

    - name: Check Container Status
      run: |
        docker ps -a

    - name: Test Container Health
      run: |
        for i in {1..10}; do
          if curl --fail http://localhost:5000/health; then
            echo "Application is healthy"
            exit 0
          fi

          echo "Waiting for application..."
          sleep 2
        done

        echo "Application failed health check"
        docker logs devsecops-app
        exit 1

    - name: Show Container Logs
      if: always()
      run: |
        docker logs devsecops-app || true

    - name: Cleanup Container
      if: always()
      run: |
        docker stop devsecops-app || true
        docker rm devsecops-app || true