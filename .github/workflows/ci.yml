name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: false

jobs:

  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Unit Tests
        run: |
          pytest app/tests/


  repository-security:
    name: Repository Security Scan
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trivy Repository Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1


  docker:
    name: Docker Build and Security Test
    needs:
      - test
      - repository-security

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t aws-devsecops-app:${{ github.sha }} \
            .

      - name: Generate Trivy Security Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aws-devsecops-app:${{ github.sha }}
          format: json
          output: trivy-report.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 0

      - name: Upload Trivy Security Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.json

      - name: Enforce Container Security Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aws-devsecops-app:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Run Docker Container
        run: |
          docker run \
            -d \
            --name devsecops-app \
            -p 5000:5000 \
            aws-devsecops-app:${{ github.sha }}

      - name: Test Container Health
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:5000/health; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          exit 1

      - name: Show Container Logs
        if: always()
        run: docker logs devsecops-app || true

      - name: Cleanup Container
        if: always()
        run: |
          docker stop devsecops-app || true
          docker rm devsecops-app || true


  terraform:
    name: Terraform CI and IaC Security
    needs:
      - test
      - repository-security

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init for Validation
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Generate Terraform Validation Report
        working-directory: terraform
        run: terraform validate -json > terraform-validation.json

      - name: Upload Terraform Validation Report
        uses: actions/upload-artifact@v4
        with:
          name: terraform-validation-report
          path: terraform/terraform-validation.json

      - name: Checkov IaC Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false


  push-ecr:
    name: Build and Push Image to ECR

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    needs:
      - test
      - repository-security
      - docker
      - terraform

    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if Image Already Exists
        id: image-check
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists in ECR."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ECR Image
        if: steps.image-check.outputs.exists != 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f docker/Dockerfile \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

      - name: Generate ECR Image Security Report
        if: steps.image-check.outputs.exists != 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          format: json
          output: trivy-ecr-report.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 0

      - name: Upload ECR Image Security Report
        if: steps.image-check.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-ecr-image-report
          path: trivy-ecr-report.json

      - name: Enforce ECR Image Security Gate
        if: steps.image-check.outputs.exists != 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Push Docker Image to ECR
        if: steps.image-check.outputs.exists != 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Export Image URI
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "$IMAGE_URI"


  terraform-plan:
    name: Terraform Plan and Safety Gate

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    needs:
      - terraform
      - push-ecr

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -reconfigure \
            -input=false

      - name: Terraform Plan
        working-directory: terraform
        env:
          CONTAINER_IMAGE: ${{ needs.push-ecr.outputs.image }}
        run: |
          terraform plan \
            -var="container_image=$CONTAINER_IMAGE" \
            -out=tfplan \
            -input=false

      - name: Generate Human Readable Plan
        working-directory: terraform
        run: |
          terraform show -no-color tfplan > tfplan.txt

      - name: Generate Terraform JSON Plan
        working-directory: terraform
        run: |
          terraform show -json tfplan > tfplan.json

      - name: Terraform Destructive Change Safety Gate
        working-directory: terraform
        run: |
          echo "Checking Terraform plan for destructive changes..."

          python <<'PYTHON'
          import json
          import sys

          with open("tfplan.json", "r") as f:
              plan = json.load(f)

          blocked = []
          allowed = []

          for change in plan.get("resource_changes", []):
              address = change.get("address", "")
              actions = change.get("change", {}).get("actions", [])

              destructive = "delete" in actions

              if not destructive:
                  continue

              if address == "aws_ecs_task_definition.app":
                  allowed.append((address, actions))
              else:
                  blocked.append((address, actions))

          print()
          print("Allowed destructive/replacement changes:")
          if allowed:
              for address, actions in allowed:
                  print(f"  ALLOWED: {address} -> {actions}")
          else:
              print("  None")

          print()
          print("Blocked destructive/replacement changes:")
          if blocked:
              for address, actions in blocked:
                  print(f"  BLOCKED: {address} -> {actions}")

              print()
              print("ERROR: Terraform plan contains destructive infrastructure changes.")
              print("Review the plan before deployment.")
              sys.exit(1)

          print("  None")
          print()
          print("Terraform safety gate passed.")
          PYTHON

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            terraform/tfplan
            terraform/tfplan.txt
            terraform/tfplan.json


  terraform-apply:
    name: Terraform Apply

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    needs:
      - terraform-plan
      - push-ecr

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -reconfigure \
            -input=false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      - name: Show Terraform Outputs
        working-directory: terraform
        run: terraform output


  smoke-test:
    name: ECS Deployment Verification

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    needs:
      - terraform-apply

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -reconfigure \
            -input=false

      - name: Get Deployment Information
        id: deployment
        working-directory: terraform
        run: |
          ECS_CLUSTER=$(terraform output -raw ecs_cluster_name)
          ECS_SERVICE=$(terraform output -raw ecs_service_name)
          ALB_DNS=$(terraform output -raw load_balancer_dns)

          echo "cluster=$ECS_CLUSTER" >> "$GITHUB_OUTPUT"
          echo "service=$ECS_SERVICE" >> "$GITHUB_OUTPUT"
          echo "dns=$ALB_DNS" >> "$GITHUB_OUTPUT"

          echo "ECS Cluster: $ECS_CLUSTER"
          echo "ECS Service: $ECS_SERVICE"
          echo "ALB DNS: $ALB_DNS"

      - name: Wait for ECS Service Stability
        env:
          ECS_CLUSTER: ${{ steps.deployment.outputs.cluster }}
          ECS_SERVICE: ${{ steps.deployment.outputs.service }}
        run: |
          echo "Waiting for ECS service to become stable..."

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "ECS service is stable."

      - name: Show ECS Deployment Status
        env:
          ECS_CLUSTER: ${{ steps.deployment.outputs.cluster }}
          ECS_SERVICE: ${{ steps.deployment.outputs.service }}
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].deployments[*].{Status:status,RolloutState:rolloutState,Desired:desiredCount,Running:runningCount,Pending:pendingCount,TaskDefinition:taskDefinition}' \
            --output table

      - name: Test Application Health
        env:
          ALB_DNS: ${{ steps.deployment.outputs.dns }}
        run: |
          for i in {1..20}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              "http://$ALB_DNS/health"; then

              echo
              echo "Application is healthy."
              exit 0

            fi

            echo "Waiting for application..."
            sleep 15

          done

          echo "Application health check failed."
          exit 1

      - name: Test Application Home Page
        env:
          ALB_DNS: ${{ steps.deployment.outputs.dns }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            "http://$ALB_DNS/"