name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Unit Tests
        run: |
          pytest app/tests/


  repository-security:
    name: Repository Security Scan
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trivy Repository Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1


  docker:
    name: Docker Build and Security Test
    needs:
      - test
      - repository-security

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t aws-devsecops-app:${{ github.sha }} \
            .

      - name: Generate Trivy Security Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aws-devsecops-app:${{ github.sha }}
          format: json
          output: trivy-report.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 0

      - name: Upload Trivy Security Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.json

      - name: Enforce Container Security Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aws-devsecops-app:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Run Docker Container
        run: |
          docker run \
            -d \
            --name devsecops-app \
            -p 5000:5000 \
            aws-devsecops-app:${{ github.sha }}

      - name: Test Container Health
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:5000/health; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed health check"
          exit 1

      - name: Show Container Logs
        if: always()
        run: |
          docker logs devsecops-app || true

      - name: Cleanup Container
        if: always()
        run: |
          docker stop devsecops-app || true
          docker rm devsecops-app || true


  terraform:
    name: Terraform CI and IaC Security
    needs:
      - test
      - repository-security

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Generate Terraform Validation Report
        working-directory: terraform
        run: |
          terraform validate -json > terraform-validation.json

      - name: Upload Terraform Validation Report
        uses: actions/upload-artifact@v4
        with:
          name: terraform-validation-report
          path: terraform/terraform-validation.json

      - name: Checkov IaC Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false